name: Magento CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check all PHP files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" || failed=1
          done < <(find app/code tests -type f -name '*.php' -print0)
          exit "$failed"

  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run PHPCS and save report
        id: phpcs_test
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports

          vendor/bin/phpcs \
            --standard=PSR12 \
            --report=full \
            app/code/Training/Cicd/Model

          status=$?

          vendor/bin/phpcs \
            --standard=PSR12 \
            --report=checkstyle \
            --report-file=build/reports/phpcs.xml \
            app/code/Training/Cicd/Model || true

          exit "$status"

      - name: Annotate PR with PHPCS errors
        if: github.event_name == 'pull_request' && steps.phpcs_test.outcome == 'failure'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          reviewdog \
            -f=checkstyle \
            -name=PHPCS \
            -reporter=github-pr-check \
            -filter-mode=nofilter \
            -fail-on-error=false \
            < build/reports/phpcs.xml

        - name: Fail if PHPCS found errors
          if: steps.phpcs_test.outcome == 'failure'
          run: exit 1

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPUnit
        run: |
          mkdir -p build/reports

          vendor/bin/phpunit \
            --bootstrap vendor/autoload.php \
            --testdox \
            --log-junit build/reports/phpunit.xml \
            tests

      - name: Publish PHPUnit results to PR
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/reports/phpunit.xml
          check_name: PHPUnit Test Report
          detailed_summary: true
          require_tests: true
          fail_on_parse_error: true
