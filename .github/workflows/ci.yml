name: Magento CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check all PHP files
        shell: bash
        run: |
          files="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/php-lint.XXXXXX")"
          trap 'rm -f -- "$files"' EXIT

          if ! find app/code tests -type f -name '*.php' -print0 > "$files"; then
            echo "::error::PHP file discovery failed."
            exit 1
          fi

          if [[ ! -s "$files" ]]; then
            echo "::error::No PHP files were found to lint."
            exit 1
          fi

          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" || failed=1
          done < "$files"
          exit "$failed"

  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run PHPCS and save report
        id: phpcs_test
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports

          set +e

          vendor/bin/phpcs \
            --standard=PSR12 \
            --report=full \
            app/code/Training/Cicd/Model

          status=$?

          vendor/bin/phpcs \
            --standard=PSR12 \
            --report=checkstyle \
            --report-file=build/reports/phpcs.xml \
            app/code/Training/Cicd/Model

          report_status=$?

          set -e

          if [ ! -f build/reports/phpcs.xml ]; then
            echo "::error::PHPCS XML report was not generated"
            exit 1
          fi

          if [ "$status" -ne 0 ] || [ "$report_status" -ne 0 ]; then
            exit 1
          fi

      - name: Annotate PR with PHPCS errors
        if: github.event_name == 'pull_request' && steps.phpcs_test.outcome == 'failure'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          reviewdog \
            -f=checkstyle \
            -name=PHPCS \
            -reporter=github-pr-check \
            -filter-mode=nofilter \
            -fail-on-error=false \
            < build/reports/phpcs.xml

      - name: Fail if PHPCS found errors
        if: steps.phpcs_test.outcome == 'failure'
        run: exit 1

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPUnit
        run: |
          mkdir -p build/reports

          vendor/bin/phpunit \
            --bootstrap vendor/autoload.php \
            --testdox \
            --log-junit build/reports/phpunit.xml \
            tests

      - name: Publish PHPUnit results to PR
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/reports/phpunit.xml
          check_name: PHPUnit Test Report
          detailed_summary: true
          require_tests: true
          fail_on_parse_error: true

  ci-success:
    name: CI Passed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - php-lint
      - phpcs
      - phpunit

    steps:
      - name: Verify required CI job results
        if: ${{ always() }}
        shell: bash
        env:
          PHP_LINT_RESULT: ${{ needs.php-lint.result }}
          PHPCS_RESULT: ${{ needs.phpcs.result }}
          PHPUNIT_RESULT: ${{ needs.phpunit.result }}
        run: |
          echo "PHP Lint: $PHP_LINT_RESULT"
          echo "PHP CodeSniffer: $PHPCS_RESULT"
          echo "PHPUnit: $PHPUNIT_RESULT"

          if [[ "$PHP_LINT_RESULT" != success || "$PHPCS_RESULT" != success || "$PHPUNIT_RESULT" != success ]]; then
            echo "::error::All required CI jobs must succeed."
            exit 1
          fi
