name: Deploy Magento Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Magento CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: magento-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and Deploy
        shell: bash
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_PORT }}
          ROOT: ${{ secrets.STAGING_PATH }}
          RUN_ID: ${{ github.run_id }}
          STAGING_PHP_BIN: ${{ vars.STAGING_PHP_BIN }}
        run: |
          set -euo pipefail

          if [[ "$STAGING_PHP_BIN" != /* ]]; then
            echo "STAGING_PHP_BIN must be set to an absolute PHP CLI path." >&2
            exit 1
          fi

          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"

          # SSH sends a command string parsed by the remote login shell.
          shell_quote() {
            local value="$1"
            printf "'"
            while [[ "$value" == *"'"* ]]; do
              printf '%s%s' "${value%%\'*}" "'\''"
              value="${value#*\'}"
            done
            printf "%s'" "$value"
          }

          REMOTE_ARGS="$(shell_quote "$ROOT") $(shell_quote "$RUN_ID") $(shell_quote "$STAGING_PHP_BIN")"
          REMOTE_PACKAGE="$(shell_quote "$ROOT/var/cicd/releases/$RUN_ID/training.tar.gz")"

          echo "Packaging Training modules..."

          tar -czf "$RUNNER_TEMP/training.tar.gz" \
            -C app/code Training

          echo "Checking staging compatibility..."

          ssh $SSH_OPTS -p "$PORT" "$USER@$HOST" \
            "bash -s -- $REMOTE_ARGS" <<'REMOTE'
          set -euo pipefail

          ROOT="$1"
          RUN_ID="$2"
          PHP_BIN="$3"

          case "$ROOT" in
            */applications/maevfyzheh/public_html) ;;
            *) echo "Invalid staging path"; exit 1 ;;
          esac

          cd "$ROOT"
          test -f bin/magento

          if [[ "$PHP_BIN" != /* || ! -f "$PHP_BIN" || ! -x "$PHP_BIN" ]]; then
            echo "STAGING_PHP_BIN must point to an executable PHP CLI file." >&2
            exit 1
          fi

          echo "Selected staging PHP version:"
          "$PHP_BIN" -v

          COMPOSER_BIN="$(command -v composer)" || {
            echo "An existing Composer executable is required on the staging deploy user's PATH." >&2
            exit 1
          }

          echo "Checking installed production dependencies..."
          "$PHP_BIN" "$COMPOSER_BIN" --no-plugins --no-scripts check-platform-reqs --no-dev

          echo "Checking Magento CLI bootstrap..."
          "$PHP_BIN" bin/magento --version

          echo "Creating deployment directory..."
          mkdir -p "var/cicd/releases/$RUN_ID" var/cicd/backups
          REMOTE

          echo "Uploading Training package..."

          ssh $SSH_OPTS -p "$PORT" "$USER@$HOST" \
            "cat > $REMOTE_PACKAGE" \
            < "$RUNNER_TEMP/training.tar.gz"

          echo "Verifying uploaded package..."

          ssh $SSH_OPTS -p "$PORT" "$USER@$HOST" \
            "test -s $REMOTE_PACKAGE && echo 'Upload successful'"

          echo "Starting Magento deployment..."

          ssh $SSH_OPTS -p "$PORT" "$USER@$HOST" \
            "bash -s -- $REMOTE_ARGS" <<'REMOTE'
          set -Eeuo pipefail

          ROOT="$1"
          RUN_ID="$2"
          PHP_BIN="$3"

          cd "$ROOT"

          MODULE_DIR="app/code/Training"
          OLD_DIR="app/code/.training-old-$RUN_ID"

          RELEASE="var/cicd/releases/$RUN_ID"
          PACKAGE="$RELEASE/training.tar.gz"
          BACKUP="var/cicd/backups/backup-training-$RUN_ID.tar.gz"

          EXISTED=0

          echo "Extracting new code..."

          tar -xzf "$PACKAGE" -C "$RELEASE"

          test -d "$RELEASE/Training"
          test ! -e "$OLD_DIR"

          echo "Backing up existing code..."

          if [ -d "$MODULE_DIR" ]; then
            tar -czf "$BACKUP" -C app/code Training
            EXISTED=1
            echo "Backup created: $BACKUP"
          fi

          rollback() {
            echo "DEPLOY FAILED - ROLLBACK"

            if [ -d "$OLD_DIR" ]; then
              rm -rf "$MODULE_DIR"
              mv "$OLD_DIR" "$MODULE_DIR"
              echo "Previous Training directory restored"
            elif [ "$EXISTED" = "0" ]; then
              rm -rf "$MODULE_DIR"
              echo "New Training directory removed"
            fi

            "$PHP_BIN" bin/magento cache:clean || true

            echo "WARNING: Database changes are not rolled back"
          }

          trap rollback ERR

          echo "Deploying Training modules..."

          if [ "$EXISTED" = "1" ]; then
            mv "$MODULE_DIR" "$OLD_DIR"
          fi

          mv "$RELEASE/Training" "$MODULE_DIR"

          echo "Running Magento setup:upgrade..."
          "$PHP_BIN" bin/magento setup:upgrade

          echo "Running Magento deploy static content..."
          "$PHP_BIN" bin/magento s:s:d -f
          "$PHP_BIN" bin/magento s:s:d -f en_US
  
          echo "Cleaning Magento cache..."
          "$PHP_BIN" bin/magento cache:clean

          echo "Deployment successful!"

          trap - ERR

          rm -rf "$OLD_DIR"
          rm -rf "$RELEASE"

          echo "DEPLOY SUCCESS"
          REMOTE
